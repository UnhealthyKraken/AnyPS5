name: Focused JXR Linux validation

on:
  push:
    branches: [ci/jxr-linux-9954]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jxr-linux:
    if: github.repository == 'UnhealthyKraken/AnyPS5' && github.ref == 'refs/heads/ci/jxr-linux-9954'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
      CTEST_PARALLEL_LEVEL: '1'
      OMP_NUM_THREADS: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 727ea2f3c9b71464801129452b61f1ba62ae4e88
          persist-credentials: false
          submodules: recursive
          fetch-depth: 1
      - name: Record exact source and environment
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 727ea2f3c9b71464801129452b61f1ba62ae4e88
          git rev-parse HEAD
          git submodule status 3rdparty/jxrlib
          uname -a
          gcc --version
          g++ --version
          cmake --version
      - name: Install Linux build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config autoconf automake libtool nasm libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxinerama-dev libxfixes-dev libxxf86vm-dev libvulkan-dev libssl-dev
      - name: Configure actual project with bundled dependencies
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ 2>&1 | tee jxr-linux-configure.log
      - name: Build focused JXR targets and required dependencies
        run: |
          set -euo pipefail
          cmake --build build --parallel 1 --target guest_jxr_lookup_tests guest_jxr_tests 2>&1 | tee jxr-linux-build.log
      - name: Run focused raw and patched library behavior tests
        run: |
          set -euo pipefail
          readelf -d build/core/libs/libs/libSceJxr.prx
          sha256sum build/tests/guest_jxr_lookup_tests > jxr-test-binary.sha256
          kernel="$PWD/build/core/libs/libs/libkernel.prx"
          held="$PWD/build/core/libs/libs/libkernel.prx.omission-control"
          test -f "$kernel"
          test ! -e "$held"
          mv -- "$kernel" "$held"
          trap 'mv -- "$held" "$kernel"' EXIT
          python3 - <<'PY'
          import ctypes
          try:
              ctypes.CDLL('build/core/libs/libs/libSceJxr.prx')
          except OSError as error:
              print('Controlled missing dependency:', error, flush=True)
              if 'libkernel.prx' not in str(error):
                  raise
          else:
              raise SystemExit('Patched module unexpectedly loaded without its kernel dependency')
          PY
          set +e
          ctest --test-dir build --parallel 1 --output-on-failure --no-tests=error -R '^guest_jxr_lookup_patched$' -V > jxr-linux-omission-control.log 2>&1
          control_status=$?
          set -e
          cat jxr-linux-omission-control.log
          test "$control_status" -eq 8
          mv -- "$held" "$kernel"
          trap - EXIT
          sha256sum -c jxr-test-binary.sha256
          ctest --test-dir build --parallel 1 --output-on-failure --no-tests=error -R '^(guest_jxr|guest_jxr_lookup(_reference|_patched)?)$' -V 2>&1 | tee jxr-linux-tests.log
          sha256sum build/tests/guest_jxr_lookup_tests
          readelf --dyn-syms --wide build/core/libs/libs/libSceJxr.prx | grep -F 5Gjz1nLOKvo

