name: Focused system library review checks
on:
  push:
    branches: [ci/review-system-libraries-20261025]
permissions:
  contents: read
jobs:
  apple-clang-baseline:
    if: github.repository == 'UnhealthyKraken/AnyPS5' && github.ref == 'refs/heads/ci/review-system-libraries-20261025'
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 33a7053e79f6a8b8f11ff48e0f9dbb09bbbb0ee4
          persist-credentials: false
      - name: Reproduce both undeclared function errors in actual pinned sources
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          xcrun clang --version
          git submodule update --init --depth 1 3rdparty/jxrlib
          test "$(git -C 3rdparty/jxrlib rev-parse HEAD)" = f7521879862b9085318e814c6157490dd9dbbdb4
          for source in image/decode/segdec.c jxrgluelib/JXRGlueJxr.c; do
            set +e
            xcrun clang -std=c99 -Werror=implicit-function-declaration -fsyntax-only -D__ANSI__ -DDISABLE_PERF_MEASUREMENT -I3rdparty/jxrlib/common/include -I3rdparty/jxrlib/image/sys -I3rdparty/jxrlib/jxrgluelib "3rdparty/jxrlib/$source" > check.log 2>&1
            code=$?
            set -e
            cat check.log
            test "$code" -ne 0
            if [[ "$source" == image/decode/segdec.c ]]; then grep -F '_byteswap_ulong' check.log; else grep -F 'wcslen' check.log; fi
          done
