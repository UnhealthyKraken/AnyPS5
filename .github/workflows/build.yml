name: Focused wide scanner Linux validation

on:
  push:
    branches: [ci/wide-scan-linux-9863]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wide-scan-linux:
    if: github.repository == 'UnhealthyKraken/AnyPS5' && github.ref == 'refs/heads/ci/wide-scan-linux-9863'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
      CTEST_PARALLEL_LEVEL: '1'
      OMP_NUM_THREADS: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c677508e0eda25afd3fd4e92f8d47b50b51a58af
          persist-credentials: false
          submodules: recursive
          fetch-depth: 0
      - name: Record exact source and environment
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = c677508e0eda25afd3fd4e92f8d47b50b51a58af
          git rev-parse HEAD
          uname -a
          gcc --version
          g++ --version
          cmake --version
      - name: Check refreshed contribution conventions
        run: |
          set -euo pipefail
          python3 -I tools/check_conventions.py --base 9a030c2d504965cc646091030eaade1fd4a8b8d0 --head HEAD
          git diff --check 9a030c2d504965cc646091030eaade1fd4a8b8d0...HEAD
      - name: Install Linux configure prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config autoconf automake libtool nasm libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxinerama-dev libxfixes-dev libxxf86vm-dev libvulkan-dev libssl-dev
      - name: Configure actual project with bundled dependencies
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ 2>&1 | tee wide-scan-linux-configure.log
      - name: Build only the two scanner targets and required dependencies
        run: |
          set -euo pipefail
          cmake --build build --parallel 1 --target guest_wide_conversion_tests guest_wide_stream_scan_tests 2>&1 | tee wide-scan-linux-build.log
      - name: Run the two requested suites serially
        run: |
          set -euo pipefail
          ctest --test-dir build --parallel 1 --output-on-failure --no-tests=error -R '^(guest_wide_conversion|guest_wide_stream_scan)$' -V 2>&1 | tee wide-scan-linux-tests.log
          sha256sum build/tests/guest_wide_conversion_tests build/tests/guest_wide_stream_scan_tests
