name: Behavior review regression baseline
on:
  push:
    branches: [ci/review-system-libraries-20261025]
permissions:
  contents: read
concurrency:
  group: system-library-review-20261025
  cancel-in-progress: false
jobs:
  linux-focused:
    if: github.repository == 'UnhealthyKraken/AnyPS5' && github.ref == 'refs/heads/ci/review-system-libraries-20261025'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '1'
      CTEST_PARALLEL_LEVEL: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 4357ce29ae6cfccdcc356cb9eddf23aca9e7b997
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive
      - name: Install configure prerequisites
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y ninja-build pkg-config autoconf automake libtool nasm libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev libdbus-1-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxinerama-dev libxfixes-dev libxxf86vm-dev libvulkan-dev libssl-dev
      - name: Confirm regression failures against unchanged production
        shell: bash
        run: |
          set -euo pipefail
          gcc --version
          g++ --version
          while IFS='@' read -r -u 3 topic sha targets pattern failures; do
            git checkout --detach "$sha"
            test "$(git rev-parse HEAD)" = "$sha"
            git submodule update --init --recursive --jobs 1
            python3 -I tools/check_conventions.py --base 504ea3b53b237a5ea99e6daeee23b1edf3758368 --head HEAD
            git diff --check 504ea3b53b237a5ea99e6daeee23b1edf3758368...HEAD
            python3 -I core/libs/tests/test_public_headers.py --audit-only --manifest "$RUNNER_TEMP/public-$topic.json"
            if [[ "$topic" == jxr ]]; then
              build_file=core/libs/prx/libSceJxr/CMakeLists.txt
              test_target=guest_jxr_lookup_tests
              patched_target=jxr_lookup_patched
              sha256sum core/libs/tests/GuestJxrLookup.cpp core/libs/prx/libSceJxr/src/PixelFormatLookup.cpp
            else
              build_file=core/libs/prx/libSceFreeTypeOptOl/CMakeLists.txt
              test_target=guest_freetype_pfr_tests
              patched_target=guest_freetype_pfr_libraries
              sha256sum core/libs/tests/GuestFreeTypePfr.cpp core/libs/tests/GuestFreeTypePfrNull.cpp core/libs/prx/libSceFreeType/src/Pfr.cpp
            fi
            trap 'git restore -- "$build_file"' EXIT
            python3 -c 'import sys; from pathlib import Path; p=Path(sys.argv[1]); s=p.read_text(); n="    add_dependencies("+sys.argv[2]+" "+sys.argv[3]+")"; assert s.count(n)==1; p.write_text(s.replace(n,""))' "$build_file" "$test_target" "$patched_target"
            cmake -S . -B build-behavior -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
            cmake --build build-behavior --parallel 1 --target $targets
            ctest --test-dir build-behavior --show-only=json-v1 -R "$pattern" > "$RUNNER_TEMP/selected.json"
            python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); assert len(d["tests"])==5,d' "$RUNNER_TEMP/selected.json"
            set +e
            ctest --test-dir build-behavior --parallel 1 --output-on-failure --no-tests=error -R "$pattern" -V > "$RUNNER_TEMP/red-$topic.log" 2>&1
            status=$?
            set -e
            cat "$RUNNER_TEMP/red-$topic.log"
            test "$status" -ne 0
            grep -F "$failures tests failed out of 5" "$RUNNER_TEMP/red-$topic.log"
            if [[ "$topic" == jxr ]]; then
              grep -F 'forward success padding is not zero' "$RUNNER_TEMP/red-$topic.log"
              grep -F 'reverse success padding is not zero' "$RUNNER_TEMP/red-$topic.log"
            else
              grep -F 'PFR null face: metrics returned 35, expected 6; host imports 1' "$RUNNER_TEMP/red-$topic.log"
              test "$(grep -c 'PFR null-face returned 35, expected 6' "$RUNNER_TEMP/red-$topic.log")" -ge 3
            fi
            git restore -- "$build_file"
            trap - EXIT
            git diff --exit-code
          done 3<<'CASES'
          jxr@4357ce29ae6cfccdcc356cb9eddf23aca9e7b997@guest_jxr_lookup_tests guest_jxr_tests@^(guest_jxr|guest_jxr_lookup(_reference|_padding_(forward|reverse))?)$@2
          pfr@085c71dd366e64845ba8252524985e738bab9110@guest_freetype_pfr_null_face_tests guest_freetype_pfr_tests libSceFreeTypeOptOl@^guest_freetype_pfr_(reference|null_face|(metrics|advance|kerning)_raw)$@4
          CASES
